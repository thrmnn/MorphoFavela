[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ivf"
version = "0.1.0"
description = "Informal settlements Vulnerability Framework"
requires-python = ">=3.11"
dependencies = [
    "geopandas>=0.13.0",
    "shapely>=2.0.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "tqdm>=4.65.0",
    "pyviewfactor>=1.0.0",
    "pyvista>=0.32.0",
    "pvlib>=0.10.0",
    "rasterio>=1.3.0",
    "scipy>=1.8.0",
    "libpysal>=4.8.0",
    "esda>=2.5.0",
    "folium>=0.14.0",
    "ipywidgets>=8.0.0",
    "pyarrow>=10.0.0",
    "pyogrio>=0.7.0",
    "fiona>=1.9.0",
]

[project.optional-dependencies]
gpu = [
    "torch>=2.0.0",
    "pytorch3d>=0.7.0",
]
dev = [
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
markers = [
    "fast: synthetic-geometry unit tests (<5s total)",
    "integration: real-data integration tests (minutes per area)",
]
testpaths = ["tests"]
