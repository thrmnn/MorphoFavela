[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ivf"
version = "0.1.0"
description = "Informal settlements Vulnerability Framework"
requires-python = ">=3.11"
dependencies = [
    "geopandas>=0.13.0",
    "shapely>=2.0.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "tqdm>=4.65.0",
    "pyviewfactor>=1.0.0",
    "pyvista>=0.32.0",
    "pvlib>=0.10.0",
    "rasterio>=1.3.0",
    "scipy>=1.8.0",
    "scikit-learn>=1.3.0",
    "libpysal>=4.8.0",
    "esda>=2.5.0",
    "folium>=0.14.0",
    "ipywidgets>=8.0.0",
    "pyarrow>=10.0.0",
    "pyogrio>=0.7.0",
    "fiona>=1.9.0",
]

[project.optional-dependencies]
gpu = [
    "torch>=2.0.0",
    "pytorch3d>=0.7.0",
]
dev = [
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "scripts*"]

[project.scripts]
# Per-site context preparation
ivf-context = "scripts.build_extended_context:main"
ivf-download-inmet = "scripts.download_inmet_zips:main"
ivf-extract-inmet = "scripts.extract_inmet_stations:main"
ivf-wind-rose = "scripts.build_wind_rose:main"
# Per-feature analyses
ivf-svf = "scripts.run_svf_v2:main"
ivf-solar = "scripts.compute_solar_access:main"
ivf-facade-solar = "scripts.run_facade_solar:main"
ivf-morphometry = "scripts.run_morphometric_audit:main"
ivf-compare = "scripts.compare_areas:main"
# CFD patch sampling
ivf-pilot-sampling = "scripts.run_pilot_sampling:main"
ivf-campaign-sampling = "scripts.run_campaign_sampling:main"
# CFD result analysis
ivf-synthetic-cfd = "scripts.generate_synthetic_cfd_results:main"
ivf-analyze-cfd = "scripts.analyze_cfd_results:main"

[tool.pytest.ini_options]
markers = [
    "fast: synthetic-geometry unit tests (<5s total)",
    "integration: real-data integration tests (minutes per area)",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    "data",
    "outputs/paper_figures/exports",
    "docs/archive",
]

[tool.ruff.lint]
# Default rule set: pyflakes (F), pycodestyle (E,W), bugbear (B), isort (I).
select = ["E", "F", "I", "B", "W"]
# Pragmatic ignores for a research codebase:
#   E402 — imports not at top: deliberate when scripts insert sys.path first.
#   E501 — line length is already enforced by `ruff format`.
#   E712 — `x == True/False`: pandas/numpy idiomatic in masks; fixing en
#          masse risks subtle behaviour changes.
#   E741 — ambiguous var names (l, I, O): present in vendored math notation.
#   B007 — unused loop control variable: cosmetic; test fixtures often.
#   B008 — function call in argument default: argparse `type=Path()` etc.
#   B905 — `zip(strict=...)`: Python 3.10+ recommendation; not yet adopted.
#   F841 — unused local variable: 14 instances in paper_figures from
#          earlier draft revisions; cosmetic, not behavioural.
#   W291 — trailing whitespace: rare residue; ruff format catches new ones.
ignore = ["E402", "E501", "E712", "E741", "B007", "B008", "B905", "F841", "W291"]

[tool.ruff.lint.per-file-ignores]
# Paper figures share style via `from fig_style import *` — intentional.
"outputs/paper_figures/*.py" = ["F403", "F405"]
# Tests redefine fixtures via conftest in idiomatic ways.
"tests/**/*.py" = ["F811"]
