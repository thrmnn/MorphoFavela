# pre-commit hooks for IVF.
#
# Install once after cloning the repo:
#     pip install pre-commit
#     pre-commit install
#
# After that, every `git commit` runs the hooks below on the staged
# files. The same checks gate CI in `.github/workflows/ci.yml`, so a
# clean local commit means a clean CI build.
#
# To run all hooks against every file (e.g. after a config change):
#     pre-commit run --all-files

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=2048"]   # Block accidentally-staged large outputs.
      - id: mixed-line-ending
        args: ["--fix=lf"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: ["--fix"]
        files: ^(src|scripts|tests|outputs/paper_figures)/.*\.py$
      - id: ruff-format
        files: ^(src|scripts|tests|outputs/paper_figures)/.*\.py$
