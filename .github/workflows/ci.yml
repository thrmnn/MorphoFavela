name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint + format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff==0.15.15

      - name: Lint (ruff check)
        run: ruff check src/ scripts/ tests/ outputs/paper_figures/

      - name: Format check (ruff format --check)
        run: ruff format --check src/ scripts/ tests/ outputs/paper_figures/

  test:
    name: Unit tests (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install GDAL system libs
        run: |
          sudo apt-get update
          sudo apt-get install -y libgdal-dev gdal-bin

      - name: Install package + dev deps
        run: pip install -e ".[dev]"

      - name: Run unit tests
        run: pytest tests/ -m "not integration" -q --tb=short
