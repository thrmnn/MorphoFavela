# SITETERR registry — the one declared, reviewable territory per campaign site.
# PI-approved 2026-09-24. A site's boundary used to be defined in six places
# (src/svf_v2/paths.py, scripts/build_html_dashboard.py, this file's
# predecessor config/zoom_windows.yaml, src/brisa_solar/wp05_full.py's
# match_favela_group, src/brisa_solar/mare_study_area.py, data/maré/*) and
# Maré's silently differed from its citywide definition for months. Loader:
# src/sites/territory.py. Build: scripts/build_site_territory.py.
#
# Field meanings:
#   data_extent    — the file buildings/DTM are actually clipped to (path
#                     relative to data/). This is what near_boundary /
#                     edge-halo logic must keep measuring against.
#   citywide_rule  — how the site is found in data/RJ/Favelas_Limit_2019.shp:
#                     method is complexo_exact or nome_exact (the same
#                     two-tier order src.brisa_solar.wp05_full.match_favela_group
#                     already tries), target is the value matched. The loader
#                     calls match_favela_group itself (not a reimplementation)
#                     so the matched polygons are identical by construction;
#                     `method` here is the declared/expected tier, asserted
#                     against what match_favela_group actually reports.
#   study_area     — how the reviewable/statistics boundary is built:
#                       citywide_polygons        -> union(citywide_rule's match)
#                       subunits_union_in_extent -> union(subunits whose own
#                                                    area share inside
#                                                    data_extent >=
#                                                    share_threshold) ∩ data_extent
#                       polygon_file              -> union(features in `path`)
#                     share_threshold only applies to subunits_union_in_extent.
#   study_area_candidates — declared alternative study-area definitions not
#                     yet promoted to `study_area` (PI must confirm before a
#                     switch). Never used by any consumer; recorded for the
#                     territory review page and territory_provenance.json only.
#   subunits       — source + provenance for named parts of the site (null
#                     for Vidigal/Rocinha: each is one polygon, "Isolada").
#   definition_note — required when study_area and citywide_rule describe
#                     different boundaries; names the open /ops card.
#   display_rotation_deg: auto -> computed by src.sites.territory.rotation_deg
#                     from the study area's minimum rotated rectangle; never
#                     typed here.

sites:
  vidigal:
    display_name: Vidigal
    data_extent: vidigal/raw/Vidigal_Limit.shp
    citywide_rule:
      method: nome_exact
      target: Vidigal
    study_area:
      kind: citywide_polygons
    subunits: null
    display_rotation_deg: auto

  rocinha:
    display_name: Rocinha
    data_extent: rocinha/raw/rocinha_boundary.shp
    citywide_rule:
      method: nome_exact
      target: Rocinha
    study_area:
      kind: citywide_polygons
    subunits: null
    display_rotation_deg: auto

  complexo_do_alemao:
    display_name: "Complexo do Alemão"
    data_extent: complexo_do_alemao/raw/complexo_do_alemao_boundary.shp
    citywide_rule:
      method: complexo_exact
      target: "Complexo do Alemão"
    study_area:
      kind: citywide_polygons
    subunits:
      source: favelas_limit_2019_by_complexo
      name_field: nome
    display_rotation_deg: auto

  riodaspedras:
    display_name: "Rio das Pedras"
    data_extent: riodaspedras/raw/riodaspedras_boundary.shp
    citywide_rule:
      method: complexo_exact
      target: "Rio das Pedras"
    study_area:
      kind: citywide_polygons
    subunits:
      source: favelas_limit_2019_by_complexo
      name_field: nome
    display_rotation_deg: auto

  maré:
    display_name: "Maré"
    data_extent: "maré/raw/mare_boundary.shp"
    citywide_rule:
      method: complexo_exact
      target: "Maré"
    study_area:
      kind: polygon_file
      path: "maré/raw/ipp_territorios_sociais_territorio03.gpkg"
    study_area_candidates:
      - id: communities_union_in_extent
        kind: subunits_union_in_extent
        share_threshold: 0.5
        label: "Union of the 16 Redes da Maré communities ∩ data extent (the
          study area until 2026-09-24)"
        status: "history — superseded 2026-09-24 by the IPP Territórios
          Sociais outline (PI ruling, resolved_decisions id
          mare_site_study_area). Kept as a declared candidate so the old
          definition stays reproducible, not because it is under
          consideration again. Has interior gaps between communities that
          the promoted outline covers ('between communities')."
    subunits:
      source: neighbourhoods_gpkg
      file: "maré/neighbourhoods.gpkg"
      layer: communities
      provenance: "maré/neighbourhoods_provenance.json"
      name_field: community
    definition_note: >
      Maré's study area = the IPP Territórios Sociais complex outline
      (territory 03; PI ruling 2026-09-24, resolved_decisions id
      mare_site_study_area) — a single contiguous polygon, not a union of
      parts. Subunits = the 16 Redes da Maré communities; every study-area
      point/cell gets exactly one subunit label, a community name or
      "between communities" for study-area ground inside none of them
      (open passageways/canals/open land within the outline). Citywide =
      the 6 IPP Favelas_Limit_2019 polygons under complexo "Maré", pending
      open /ops card mare_citywide_definition. Marcílio Dias (one of the 16
      communities) lies outside the outline and outside the data extent —
      excluded from the study area by geometry (its own area's share
      inside the study area is 0.0), never by name. The previous study-area
      definition (union of the 16 communities ∩ data extent) is kept as a
      declared candidate/history entry, see study_area_candidates.
    display_rotation_deg: auto
